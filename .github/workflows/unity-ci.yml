name: Unity CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  repository-check:
    name: Repository check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Unity project folders
        shell: bash
        run: |
          test -d Assets
          test -d Packages
          test -d ProjectSettings

      - name: Block Unity generated folders
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            case "$file" in
              Library/*|Temp/*|Obj/*|obj/*|Logs/*|UserSettings/*)
                echo "Unity generated folder file must not be committed: $file"
                failed=1
                ;;
            esac
          done < <(git ls-files -z)

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Block oversized files
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if [ ! -f "$file" ]; then
              continue
            fi

            size="$(stat -c%s "$file")"
            if [ "$size" -gt 100000000 ]; then
              echo "File over 100MB is not allowed: $file ($size bytes)"
              failed=1
            fi
          done < <(git ls-files -z)

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Block unitypackage files
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.unitypackage)
                echo ".unitypackage file should not be committed: $file"
                failed=1
                ;;
            esac
          done < <(git ls-files -z)

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

  unity-tests:
    name: Unity ${{ matrix.testMode }} tests
    runs-on: ubuntu-latest
    needs: repository-check
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ matrix.testMode }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-${{ matrix.testMode }}-
            Library-${{ runner.os }}-

      - name: Run Unity tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-test-results

      - name: Upload Unity test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.testMode }}-test-results
          path: ${{ matrix.testMode }}-test-results
          if-no-files-found: warn

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    needs: unity-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-Android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-${{ runner.os }}-Android-
            Library-${{ runner.os }}-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: Android
          buildsPath: build

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: Android-build
          path: build
